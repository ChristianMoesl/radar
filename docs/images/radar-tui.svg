<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Radar terminal dashboard</title>
  <desc id="desc">A Radar terminal window grouping engineering tasks by urgency and showing linked Datadog, GitHub, Jira, Git, and tmux sources.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="28" fill="url(#background)"/>
  <circle cx="1285" cy="115" r="240" fill="#4338ca" opacity="0.10"/>
  <circle cx="150" cy="820" r="280" fill="#0891b2" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="70" y="58" width="1300" height="784" rx="18" fill="#0b1020" stroke="#334155" stroke-width="2"/>
    <path d="M70 76a18 18 0 0 1 18-18h1264a18 18 0 0 1 18 18v38H70z" fill="#161e2e"/>
    <line x1="70" y1="114" x2="1370" y2="114" stroke="#334155" stroke-width="2"/>
    <circle cx="102" cy="86" r="8" fill="#fb7185"/>
    <circle cx="130" cy="86" r="8" fill="#fbbf24"/>
    <circle cx="158" cy="86" r="8" fill="#4ade80"/>
    <text x="720" y="92" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17">radar — engineering attention</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">
    <text x="110" y="158" fill="#fef08a" font-size="25" font-weight="700">Radar</text>
    <text x="220" y="158" fill="#fb7185" font-weight="700">● 1 urgent</text>
    <text x="382" y="158" fill="#fbbf24" font-weight="700">◉ 2 attention</text>
    <text x="580" y="158" fill="#60a5fa" font-weight="700">◷ 2 progress</text>
    <text x="760" y="158" fill="#94a3b8" font-weight="700">◌ 1 low</text>
    <text x="882" y="158" fill="#4ade80" font-weight="700">✓ 1 done</text>

    <text x="110" y="209" fill="#fb7185" font-size="20" font-weight="700">● Need immediate attention</text>
    <rect x="105" y="228" width="1218" height="43" rx="7" fill="#4f46e5"/>
    <text x="123" y="256" fill="#fff7ed" font-weight="700">› Checkout error rate above 5%</text>
    <text x="514" y="256" fill="#e0e7ff">platform/checkout</text>
    <text x="742" y="256" fill="#e0e7ff">Datadog monitor alert</text>
    <text x="138" y="297" fill="#64748b">↳ datadog:monitor:checkout-errors</text>

    <text x="110" y="345" fill="#fbbf24" font-size="20" font-weight="700">◉ Need attention</text>
    <text x="123" y="381" fill="#e5e7eb">  Review requested: cap retry budget</text>
    <text x="568" y="381" fill="#64748b">platform/api</text>
    <text x="750" y="381" fill="#64748b">review requested</text>
    <text x="138" y="410" fill="#64748b">↳ github:pr:platform/api:184</text>
    <text x="123" y="446" fill="#e5e7eb">  Address unresolved review thread</text>
    <text x="549" y="446" fill="#64748b">web/storefront</text>
    <text x="750" y="446" fill="#64748b">1 unresolved thread</text>
    <text x="138" y="475" fill="#64748b">↳ github:pr:web/storefront:92</text>

    <text x="110" y="523" fill="#60a5fa" font-size="20" font-weight="700">◷ In progress</text>
    <text x="123" y="559" fill="#60a5fa" font-weight="700">  ● busy</text>
    <text x="243" y="559" fill="#e5e7eb">API-482 Make checkout idempotent</text>
    <text x="643" y="559" fill="#64748b">platform/checkout</text>
    <text x="138" y="588" fill="#64748b">↳ jira:issue:API-482</text>
    <text x="138" y="617" fill="#64748b">↳ git:worktree:~/workspaces/checkout/API-482</text>
    <text x="123" y="653" fill="#e5e7eb">  Prepare v0.8 release</text>
    <text x="420" y="653" fill="#64748b">developer-tools/radar</text>
    <text x="138" y="682" fill="#64748b">↳ tmux:session:radar-v0-8</text>

    <text x="110" y="730" fill="#fef08a" font-size="20" font-weight="700">Sources</text>
    <text x="123" y="762" fill="#cbd5e1">github</text><text x="252" y="762" fill="#4ade80">ok</text><text x="346" y="762" fill="#64748b">14 refs</text>
    <text x="496" y="762" fill="#cbd5e1">jira</text><text x="605" y="762" fill="#4ade80">ok</text><text x="699" y="762" fill="#64748b">8 refs</text>
    <text x="832" y="762" fill="#cbd5e1">datadog</text><text x="968" y="762" fill="#4ade80">ok</text><text x="1062" y="762" fill="#64748b">1 ref</text>

    <text x="110" y="809" fill="#64748b" font-size="16">↑/k ↓/j select  •  enter switch tmux  •  o open  •  i inspect  •  c create workspace  •  q quit</text>
  </g>
</svg>
