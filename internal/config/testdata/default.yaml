# Radar configuration — managed by `radar setup`.
# Re-run `radar setup` to update it, or edit it by hand.
# See README.md (Config) in the radar repo for configuration options.
# Directories searched for existing repository checkouts, not Radar workspaces.
repository_dirs:
  - ~/workspace
  - ~/code
  - ~/src
  - ~/dev
  - ~/projects
workspace:
  # Radar-managed workspaces live here, separately from your original checkouts.
  root_dir: ~/.local/share/radar/workspaces
  # Apply validated workspace changes without prompting. Set false to require confirmation.
  auto_confirm: true
  cleanup:
    # Exact workspace-root names cleanup may delete, even with uncommitted content. No paths or globs.
    disposable_entries: []
# Ticket prefixes used to link related work, for example [ABC]. An empty list disables only ticket-prefix linking.
linking_mark_prefixes: []
# Sandbox settings for new workspaces; existing workspaces keep their runtime.
# Omit enabled for automatic detection, or set true/false to require/disable sandboxing.
sbx:
  # Sandbox kit to launch. An optional path selects a local kit definition.
  kit:
    name: docker.io/christianmoesl/radar-kit:latest
  # Extra host directories mounted into the sandbox; repository mounts are appended. Use absolute or ~/ paths, with :ro for read-only access.
  additional_mounts: []
# Windows for new workspace sessions. Include $RADAR_PI_ARGS exactly once in the Pi command.
tmux:
  windows:
    - name: pi
      panes:
        - command: pi $RADAR_PI_ARGS
# Omit enabled to detect prerequisites automatically; true requires them and false disables collection.
github:
  # Additional open PRs (including drafts) beyond your own PRs, review requests and participation.
  # Requires repos with a concrete owner; * is allowed in the repository name.
  # Optional authors are exact logins; omit authors to include everyone. Entries are additive.
  # Tracking adds visibility, not a subscription to every discussion.
  # Example entry: {repos: ["acme/platform-*"], authors: ["renovate[bot]"]}
  track: []
  # Control each PR's contribution, not the whole linked task. Local-only work is unaffected.
  # Match repos, authors, or both on the SAME PR. Fields use AND; values within a field use OR.
  # Omitted selectors are unrestricted; at least one nonempty selector is required.
  # Patterns are case-insensitive and support *. Confirmed bots match name and name[bot].
  # First matching rule wins per PR; put keep exceptions before broader policies.
  # Actions: keep (normal), mute (no contribution), deprioritize (low-priority contribution).
  # Other sources keep their signals. Muted PRs remain linked and still affect completion.
  # A task with only muted PRs is hidden, including in Done; explicit task muting is separate.
  # Example entry: {repos: ["acme/platform-*"], authors: ["renovate[bot]"], action: deprioritize}
  pull_request_rules: []
  # Filter otherwise relevant comments/reviews by repos, actors, or both.
  # Same AND/OR, wildcard, bot-alias and first-match rules as pull_request_rules.
  # Actions: keep (normal involvement-based relevance) or ignore. keep never forces attention.
  # Feedback on your PRs and replies in review threads you joined can raise attention.
  # Unrelated tracked discussions do not. Ignoring activity does not cancel a direct review request.
  # PR-level mute/deprioritize still applies after activity rules; other sources are unaffected.
  # Example entry: {actors: ["review-bot[bot]"], action: ignore}
  activity_rules: []
# Omit enabled to detect prerequisites automatically; true requires them and false disables collection.
# Credentials belong in secrets.yaml; RADAR_JIRA_* environment values override saved settings.
jira:
  # Issue types collected as assigned work. An empty list disables assigned collection and makes title discoveries informational.
  authoritative_issue_types:
    - Story
    - Task
    - Bug
    - Sub-task
  # Map Jira status names to low_priority, in_progress, attention, or immediate. Use {} for no explicit mappings.
  status_mapping:
    In Progress: in_progress
    In Review: in_progress
  # Signal used for Jira statuses not listed above.
  unmapped_status: low_priority
# Omit enabled to detect prerequisites automatically; true requires them and false disables collection.
# Credentials belong in secrets.yaml; RADAR_DATADOG_* environment values override saved settings.
datadog:
  # Scope monitor collection to the monitors you own. An empty query disables automatic collection.
  monitor_query: ""
  # Unhealthy monitor states to collect: Alert, Warn, and/or No Data.
  monitor_statuses:
    - Alert
    - Warn
    - No Data
obsidian:
  # Task notes are stored in a Tasks/ folder here. An ordinary directory or an Obsidian vault works.
  vault_path: ""
