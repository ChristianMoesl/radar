name: Homebrew formula

# npm publication needs human approval after the binary release. Run this only
# once that approval is complete; no tap token or automated push is involved.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Latest coordinated stable release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test generator
        run: go test ./scripts/homebrew
      - name: Generate from authenticated public release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p build/homebrew/Formula
          go run ./scripts/homebrew "$RELEASE_VERSION" > build/homebrew/Formula/radar.rb
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Update Homebrew
        run: brew update
      - name: Install and test in a local tap
        run: |
          brew tap-new --no-git ChristianMoesl/tap
          cp build/homebrew/Formula/radar.rb "$(brew --repository ChristianMoesl/tap)/Formula/radar.rb"
          brew trust --formula ChristianMoesl/tap/radar
          brew style ChristianMoesl/tap/radar
          brew install --formula ChristianMoesl/tap/radar
          brew test ChristianMoesl/tap/radar
          brew uninstall ChristianMoesl/tap/radar
      - name: Upload reviewed tap candidate
        uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: homebrew-formula
          path: build/homebrew/Formula/radar.rb
      - name: Publishing instructions
        run: |
          {
            echo '## Homebrew candidate validated on this runner architecture'
            echo
            echo 'Wait for all three jobs (macOS arm64, Linux amd64/arm64) to pass, download the homebrew-formula artifact, review Formula/radar.rb, and commit it to ChristianMoesl/homebrew-tap main.'
            echo 'A human must push the tap. This workflow does not publish it or approve npm staging.'
            echo 'Real macOS launch approval and notification delivery/clicks still need interactive smoke tests.'
          } >> "$GITHUB_STEP_SUMMARY"
