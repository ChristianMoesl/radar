name: Homebrew formula

# npm approval stays human-owned. Poll public readiness cheaply; generate and
# publish only newer coordinated releases after all native checks pass.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Stable release to validate (latest ready release when omitted)
        required: false
        type: string

concurrency:
  group: radar-homebrew-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      version: ${{ steps.release.outputs.version }}
      auto_publish: ${{ steps.release.outputs.auto_publish }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Select a newer public coordinated release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          TAP_SSH_KEY_CONFIGURED: ${{ secrets.HOMEBREW_TAP_SSH_KEY != '' }}
        run: node scripts/homebrew/automation.mjs prepare

  formula:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test generator
        run: go test ./scripts/homebrew
      - name: Generate from authenticated public release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p build/homebrew/Formula
          go run ./scripts/homebrew "$RELEASE_VERSION" > build/homebrew/Formula/radar.rb
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      - name: Update Homebrew
        run: brew update
      - name: Install and test in a local tap
        run: |
          brew tap-new --no-git ChristianMoesl/tap
          cp build/homebrew/Formula/radar.rb "$(brew --repository ChristianMoesl/tap)/Formula/radar.rb"
          brew trust --formula ChristianMoesl/tap/radar
          brew style ChristianMoesl/tap/radar
          brew install --formula ChristianMoesl/tap/radar
          brew test ChristianMoesl/tap/radar
          brew uninstall ChristianMoesl/tap/radar
      - name: Upload validated tap candidate
        uses: actions/upload-artifact@v7.0.2
        if: matrix.os == 'macos-latest'
        with:
          name: homebrew-formula
          path: build/homebrew/Formula/radar.rb
      - name: Native validation summary
        run: |
          {
            echo '## Homebrew candidate validated on this runner architecture'
            echo
            echo 'Publication waits for all three jobs (macOS arm64, Linux amd64/arm64), then reauthenticates the exact candidate before updating the tap.'
            echo 'The homebrew-formula artifact remains available for inspection. Without HOMEBREW_TAP_SSH_KEY, manual dispatch validates only; it does not publish.'
            echo 'Real macOS launch approval and notification delivery/clicks still need interactive smoke tests.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [prepare, formula]
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.auto_publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep automation from this workflow revision, but authenticate the formula
      # with the release's own generator, not a newer generator against old code.
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.version }}
          path: build/release-source
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: build/release-source/go.mod
          cache: true
          cache-dependency-path: build/release-source/go.sum
      - uses: actions/download-artifact@v8.0.2
        with:
          name: homebrew-formula
          path: build/homebrew/Formula
      - name: Reauthenticate the validated candidate and reject stale releases
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd build/release-source && go run ./scripts/homebrew "$RELEASE_VERSION") > build/homebrew/verified.rb
          cmp build/homebrew/Formula/radar.rb build/homebrew/verified.rb
      - name: Publish a normal tap commit without overwrites or downgrades
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/homebrew/publish.sh "$RELEASE_VERSION" build/homebrew/Formula/radar.rb
