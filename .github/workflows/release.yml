name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build and publish binaries
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Validate package release version
        run: pnpm check:release "${GITHUB_REF_NAME}"

      - name: Install Pi dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test packed extension
        run: pnpm check

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Build release archives
        run: make dist VERSION="${GITHUB_REF_NAME}" COMMIT="$(git rev-parse --short=12 HEAD)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  stage-npm:
    name: Stage Pi package for npm approval
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No dependency cache in staging jobs. npm uses the job's OIDC identity,
      # not a persistent NODE_AUTH_TOKEN or NPM_TOKEN secret.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup npm with staged publishing support
        run: npm install --global "npm@^11.15.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Validate package release version
        run: pnpm check:release "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test packed extension
        run: pnpm check

      - name: Stage using npm trusted publishing
        run: |
          package="${RUNNER_TEMP}/pi-radar.tgz"
          pnpm pack --out "$package"
          version="$(node -p 'require("./package.json").version')"
          tag=latest
          if [[ "$version" == *-* ]]; then
            tag=next
          fi
          npm stage publish "$package" --access public --tag "$tag"
          {
            printf '## Pi package staged\n\n'
            printf '`@christianmoesl/pi-radar@%s` is staged for `%s`, not publicly published.\n\n' "$version" "$tag"
            printf 'Review it in the **Staged Packages** tab on npmjs.com and approve with 2FA to publish.\n'
          } >> "$GITHUB_STEP_SUMMARY"
