name: Terraform live validation
run-name: "Terraform live validation: ${{ inputs.pr_number && format('PR #{0}', inputs.pr_number) || 'main' }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Leave empty to validate trusted main automatically; a PR number requires approval of its exact head
        type: string
        required: false
      run_id:
        description: Existing personal run for collection; empty creates one. Failure and apply/cancel fixtures always run.
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read
  deployments: read

concurrency:
  group: terraform-live-validation
  cancel-in-progress: false

jobs:
  readiness:
    name: Select trusted main or an approval-gated PR revision
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pr_number: ${{ steps.gate.outputs.pr_number }}
      sha: ${{ steps.gate.outputs.sha }}
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - name: Reject workflow refs outside main before accessing credentials
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Dispatch Terraform live validation on trusted main.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin the tested revision and validate its environment policy
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 scripts/live-pr-gate.py resolve

  live:
    name: "${{ needs.readiness.outputs.pr_number && format('Approve PR #{0}', needs.readiness.outputs.pr_number) || 'Validate trusted main' }} at ${{ needs.readiness.outputs.sha }}"
    needs: readiness
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.readiness.outputs.environment }}
      url: https://github.com/${{ github.repository }}/commit/${{ needs.readiness.outputs.sha }}
    timeout-minutes: 50
    steps:
      # Keep approval/control code on the trusted workflow revision. The PR's
      # workflow and gate helper are never used to authorize its own execution.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Recheck the selected revision and environment before execution
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.readiness.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.readiness.outputs.sha }}
        run: python3 control/scripts/live-pr-gate.py verify
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.readiness.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: candidate/go.mod
          cache-dependency-path: candidate/go.sum
      - name: Require both qualification tests in the pinned revision
        working-directory: candidate
        run: |
          tests=$(go test ./internal/integration/terraform -list '^TestLiveTerraform(Collection|FailureAcknowledgement)$')
          for test_name in TestLiveTerraformCollection TestLiveTerraformFailureAcknowledgement; do
            if ! printf '%s\n' "$tests" | grep -qx "$test_name"; then
              echo "The pinned candidate revision must contain $test_name." >&2
              exit 1
            fi
          done
      - name: Build the pinned daemon for isolated lifecycle validation
        working-directory: candidate
        run: go build -o "$RUNNER_TEMP/radar-terraform-live" ./cmd/radar
      - name: Install checksum-pinned Terraform CLIs
        run: |
          curl -fsSL https://releases.hashicorp.com/tfctl/0.4.0/tfctl_0.4.0_linux_amd64.zip -o "$RUNNER_TEMP/tfctl.zip"
          printf '055d365cf165708dd304747f27a7242c51ce61a0bf680bd83fd3abe7cbcaa356  %s\n' "$RUNNER_TEMP/tfctl.zip" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/tfctl-live"
          unzip -q "$RUNNER_TEMP/tfctl.zip" tfctl -d "$RUNNER_TEMP/tfctl-live"
          chmod 0755 "$RUNNER_TEMP/tfctl-live/tfctl"
          echo "$RUNNER_TEMP/tfctl-live" >> "$GITHUB_PATH"
          curl -fsSL https://releases.hashicorp.com/terraform/1.17.0/terraform_1.17.0_linux_amd64.zip -o "$RUNNER_TEMP/terraform.zip"
          printf 'c168cab7c637a8769fdb90089ddd19de701bc6ff8aca64dc2e2185fe46f59f67  %s\n' "$RUNNER_TEMP/terraform.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP/tfctl-live"
          chmod 0755 "$RUNNER_TEMP/tfctl-live/terraform"
      - name: Create a personal speculative fixture run without applying
        if: inputs.run_id == ''
        id: fixture
        timeout-minutes: 8
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TFCTL_TOKEN }}
        run: python3 control/scripts/terraform-live-plan.py --configuration "$GITHUB_WORKSPACE/control/testdata/terraform-live"
      - name: Qualify production collection and cold binding reads
        working-directory: candidate
        env:
          TFCTL_TOKEN: ${{ secrets.TFCTL_TOKEN }}
          RADAR_TEST_TERRAFORM_LIVE: '1'
          RADAR_TEST_TERRAFORM_HOSTNAME: app.terraform.io
          RADAR_TEST_TERRAFORM_ORGANIZATION: radar-oss
          RADAR_TEST_TERRAFORM_WORKSPACE: radar-oauth-e2e
          RADAR_TEST_TERRAFORM_RUN_ID: ${{ inputs.run_id || steps.fixture.outputs.run_id }}
        run: |
          if [ -z "$TFCTL_TOKEN" ]; then
            echo 'Add the personal Terraform user token as TFCTL_TOKEN in the selected live validation environment.' >&2
            exit 1
          fi
          go test ./internal/integration/terraform -run '^TestLiveTerraformCollection$' -count=1 -timeout=4m -v
      - name: Create a personal speculative run with the deliberate fixture failure
        id: failure
        timeout-minutes: 8
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TFCTL_TOKEN }}
        run: python3 control/scripts/terraform-live-plan.py --configuration "$GITHUB_WORKSPACE/control/testdata/terraform-live" --expect-failure
      - name: Require failed run Attention then acknowledged Done
        working-directory: candidate
        env:
          TFCTL_TOKEN: ${{ secrets.TFCTL_TOKEN }}
          RADAR_TEST_TERRAFORM_LIVE: '1'
          RADAR_TEST_TERRAFORM_HOSTNAME: app.terraform.io
          RADAR_TEST_TERRAFORM_ORGANIZATION: radar-oss
          RADAR_TEST_TERRAFORM_WORKSPACE: radar-oauth-e2e
          RADAR_TEST_TERRAFORM_RUN_ID: ${{ steps.failure.outputs.run_id }}
        run: go test ./internal/integration/terraform -run '^TestLiveTerraformFailureAcknowledgement$' -count=1 -timeout=4m -v
      - name: Qualify approval, apply, cancellation and daemon recovery in the disposable workspace
        timeout-minutes: 20
        env:
          TFCTL_TOKEN: ${{ secrets.TFCTL_TOKEN }}
        run: python3 control/scripts/terraform-live-lifecycle.py --configuration "$GITHUB_WORKSPACE/control/testdata/terraform-live" --radar "$RUNNER_TEMP/radar-terraform-live"
