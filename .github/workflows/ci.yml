name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pi:
    name: Pi package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test packed extension
        run: pnpm check
      - name: Check package contents
        run: pnpm pack --dry-run

  go:
    name: Format, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Go bootstrap tests execute the installer, which requires Node.js 24+.
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Check Go formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Check Linux release packaging
        run: make dist VERSION=ci DIST_TARGETS="linux/amd64 linux/arm64"

  macos-notifier:
    name: Build macOS notifier and release archives
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Keep bootstrap tests independent of the runner's preinstalled Node.js.
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Test installation and integration defaults on macOS
        run: go test ./scripts ./scripts/homebrew ./internal/app ./internal/config ./internal/collector ./internal/pi ./internal/notification ./internal/integration/...

      - name: Check Homebrew formula style
        run: brew style scripts/homebrew/testdata/Formula/radar.rb

      - name: Check macOS release packaging
        run: make dist VERSION=ci DIST_TARGETS="darwin/arm64"

  linux-installer:
    name: Rootless Linux installer (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm, ubuntu:24.04, fedora:latest, archlinux:latest]
    container: ${{ matrix.image }}
    steps:
      # Test setup may install tools as root; the installer suite itself must run
      # as a normal user and checks that ready tools need no package-manager call
      # and missing tools cannot consume approval from piped input.
      - name: Prepare container tools
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash git ca-certificates passwd zsh fish
          elif command -v dnf >/dev/null; then
            dnf install -y bash git ca-certificates shadow-utils zsh fish
          else
            pacman -Syu --noconfirm bash git ca-certificates shadow zsh fish
          fi
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Test as an unprivileged user
        run: |
          useradd --create-home --shell /bin/bash radar-test
          node_binary="$(command -v node)"
          # Exercise a permissive user umask without relying on distro defaults.
          su -s /bin/bash radar-test -c "umask 0002; \"$node_binary\" --test scripts/linux-install.test.mjs"

  linux-homebrew:
    name: Linux Homebrew install (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      - name: Build native source archive
        run: make dist VERSION=v1.2.3 DIST_TARGETS="linux/${{ matrix.arch }}"
      - name: Install, test and uninstall with real Homebrew
        run: scripts/homebrew/smoke-test.sh "dist/radar_v1.2.3_linux_${{ matrix.arch }}.tar.gz"
