name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pi:
    name: Pi package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test packed extension
        run: pnpm check
      - name: Check package contents
        run: pnpm pack --dry-run

  go:
    name: Format, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Check Linux release packaging
        run: make dist VERSION=ci DIST_TARGETS="linux/amd64 linux/arm64"

  macos-notifier:
    name: Build macOS notifier and release archives
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test installation and integration defaults on macOS
        run: go test ./scripts ./scripts/homebrew ./internal/app ./internal/config ./internal/collector ./internal/pi ./internal/notification ./internal/integration/...

      - name: Check Homebrew formula style
        run: brew style scripts/homebrew/testdata/Formula/radar.rb

      - name: Check macOS release packaging
        run: make dist VERSION=ci DIST_TARGETS="darwin/amd64 darwin/arm64"
