name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  provider-cli-contracts:
    name: Provider CLI contracts (${{ matrix.os }}, offline provider fixtures)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install checksum-pinned tfctl 0.4.0 in the runner temp directory
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, platform, urllib.request, zipfile
          arch = {"x86_64": "amd64", "aarch64": "arm64", "arm64": "arm64"}[platform.machine().lower()]
          target = platform.system().lower() + "_" + arch
          expected = {
              "linux_amd64": "055d365cf165708dd304747f27a7242c51ce61a0bf680bd83fd3abe7cbcaa356",
              "linux_arm64": "5f2caf7900b8f43dd72f390b992bafceab4ae85bbc58b60325bb1888ef9a0e53",
              "darwin_arm64": "e53f2b965eec2435d5543ff4b6ff799b4beac0e0c233a3a355158abe4c524632",
          }[target]
          with urllib.request.urlopen("https://releases.hashicorp.com/tfctl/0.4.0/tfctl_0.4.0_" + target + ".zip", timeout=60) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit("tfctl release checksum mismatch")
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tfctl-contract"
          destination.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              (destination / "tfctl").write_bytes(archive.read("tfctl"))
          (destination / "tfctl").chmod(0o755)
          PY
      - name: Verify personal tfctl identity and run JSON against a TLS fixture
        run: RADAR_TEST_TFCTL="$RUNNER_TEMP/tfctl-contract/tfctl" go test ./internal/integration/terraform -run TestReleasedTFCTL -v
      - name: Install checksum-verified Pup 2.0.0 in the runner temp directory
        run: |
          curl -fsSL https://raw.githubusercontent.com/DataDog/pup/v2.0.0/install.sh -o "$RUNNER_TEMP/install-pup.sh"
          PUP_VERSION=2.0.0 PUP_INSTALL_DIR="$RUNNER_TEMP/pup-contract" sh "$RUNNER_TEMP/install-pup.sh"
      - name: Verify raw JSON, named OAuth selection and rejection before API-key fallback
        run: RADAR_TEST_PUP="$RUNNER_TEMP/pup-contract/pup" go test ./internal/integration/datadog -run TestReleasedPupOAuthGuard
      - name: Install checksum-verified TWG 1.3.8 in the runner temp directory
        run: |
          curl -fsSL https://teamwork-graph.atlassian.com/cli/install -o "$RUNNER_TEMP/install-twg.sh"
          TWG_CONFIG_DIR="$RUNNER_TEMP/twg-config" bash "$RUNNER_TEMP/install-twg.sh" --version 1.3.8 --install-dir "$RUNNER_TEMP/twg-contract" --skip-login --skip-skills --yes
      - name: Verify missing profiles reject static-auth API dispatch without a terminal
        run: RADAR_TEST_TWG="$RUNNER_TEMP/twg-contract/twg" go test ./internal/integration/jira -run TestReleasedTWGMissingProfile

  durable-agents-sbx:
    name: Durable agent in real SBX
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=docker/sbx-releases
      SBX_VERSION: v0.48.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - name: Build Radar and install SBX
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find
          ln -s /usr/bin/fdfind "$RUNNER_TEMP/fd"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          go build -o "$RUNNER_TEMP/radar" ./cmd/radar
          curl -fsSL "https://github.com/docker/sbx-releases/releases/download/${SBX_VERSION}/DockerSandboxes-linux-amd64.tar.gz" -o "$RUNNER_TEMP/sbx.tar.gz"
          tar -xzf "$RUNNER_TEMP/sbx.tar.gz" -C "$RUNNER_TEMP"
          sudo env PREFIX="$RUNNER_TEMP/sbx" "$RUNNER_TEMP/docker-sbx/install.sh"
          echo "$RUNNER_TEMP/sbx/bin" >> "$GITHUB_PATH"
      # This job never runs untrusted PR code with repository credentials.
      - name: Sign in to SBX
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          sudo chmod a+rw /dev/kvm
          printf '%s' "$DOCKERHUB_TOKEN" | sbx login --username "$DOCKERHUB_USERNAME" --password-stdin
          sbx policy init balanced
      - name: Exercise durable review and recovery in one managed VM
        timeout-minutes: 6
        env:
          RADAR_BINARY: ${{ runner.temp }}/radar
          RADAR_SBX_KIT: ${{ github.workspace }}/sandbox/kit
        run: node --experimental-strip-types --test --test-timeout=180000 --test-name-pattern='mode=sbx' agent-host/test/review.test.ts

  durable-agents:
    name: Durable agent recovery and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: pnpm install --frozen-lockfile
      - name: Install Radar repository discovery tool
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find
          ln -s /usr/bin/fdfind "$RUNNER_TEMP/fd"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: go build -o "$RUNNER_TEMP/radar" ./cmd/radar
      - run: pnpm --filter @christianmoesl/radar-agent-host check
        env:
          RADAR_BINARY: ${{ runner.temp }}/radar
      - run: pnpm --filter @christianmoesl/radar-agent-host build
      - run: pnpm --dir agent-host pack --out "$RUNNER_TEMP/radar-agent-host.tgz"
      - run: node scripts/smoke-agent-package.mjs "$RUNNER_TEMP/radar-agent-host.tgz"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: radar-agent-host
          path: ${{ runner.temp }}/radar-agent-host.tgz
      - run: go test ./internal/agentservice ./internal/workspacelease ./internal/integration/agent

  pi:
    name: Pi package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test packed extension
        run: pnpm check
      - name: Check package contents
        run: pnpm pack --dry-run

  go:
    name: Format, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Go bootstrap tests execute the installer, which requires Node.js 24+.
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Check Go formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test live E2E harness safeguards without account access
        run: python3 -m unittest discover -s scripts -p 'test_live_e2e.py'

      - name: Check Linux release packaging
        run: make dist VERSION=ci DIST_TARGETS="linux/amd64 linux/arm64"

  macos-notifier:
    name: Build macOS notifier and release archives
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Keep bootstrap tests independent of the runner's preinstalled Node.js.
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Test installation and integration defaults on macOS
        run: go test ./scripts ./scripts/homebrew ./internal/app ./internal/config ./internal/collector ./internal/pi ./internal/notification ./internal/agentservice ./internal/workspacelease ./internal/onboarding ./internal/hostsetup ./internal/setup/... ./internal/integration/...

      - name: Check Homebrew formula style
        run: brew style scripts/homebrew/testdata/Formula/radar.rb

      - name: Check macOS release packaging
        run: make dist VERSION=ci DIST_TARGETS="darwin/arm64"

  linux-installer:
    name: Rootless Linux installer (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bookworm, ubuntu:24.04, fedora:latest, archlinux:latest]
    container: ${{ matrix.image }}
    steps:
      # Test setup may install tools as root; the installer suite itself must run
      # as a normal user and checks that ready tools need no package-manager call
      # and missing tools cannot consume approval from piped input.
      - name: Prepare container tools
        shell: sh
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bash git ca-certificates passwd zsh fish
          elif command -v dnf >/dev/null; then
            dnf install -y bash git ca-certificates shadow-utils zsh fish
          else
            pacman -Syu --noconfirm bash git ca-certificates shadow zsh fish
          fi
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Test as an unprivileged user
        run: |
          useradd --create-home --shell /bin/bash radar-test
          node_binary="$(command -v node)"
          # Exercise a permissive user umask without relying on distro defaults.
          su -s /bin/bash radar-test -c "umask 0002; \"$node_binary\" --test scripts/linux-install.test.mjs"

  linux-homebrew:
    name: Linux Homebrew install (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      - name: Build native source archive
        run: make dist VERSION=v1.2.3 DIST_TARGETS="linux/${{ matrix.arch }}"
      - name: Install, test and uninstall with real Homebrew
        run: scripts/homebrew/smoke-test.sh "dist/radar_v1.2.3_linux_${{ matrix.arch }}.tar.gz"
