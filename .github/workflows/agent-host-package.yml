name: Stage durable agent host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: npm install --global 'npm@^11.15.0'
      - run: pnpm install --frozen-lockfile
      - name: Install repository discovery tool
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find
          ln -s /usr/bin/fdfind "$RUNNER_TEMP/fd"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: go build -o "$RUNNER_TEMP/radar" ./cmd/radar
      - run: pnpm --filter @christianmoesl/radar-agent-host check
        env:
          RADAR_BINARY: ${{ runner.temp }}/radar
      - run: go test ./internal/agentservice ./internal/workspacelease ./internal/integration/workspace ./internal/tui
      - name: Pack and validate isolated installation
        run: |
          pnpm --dir agent-host pack --out "$RUNNER_TEMP/radar-agent-host.tgz"
          node scripts/smoke-agent-package.mjs "$RUNNER_TEMP/radar-agent-host.tgz"
      - name: Stage for manual npm approval
        working-directory: agent-host
        run: |
          npm stage publish "$RUNNER_TEMP/radar-agent-host.tgz" --access public --tag latest
          printf 'Host package staged. Review the artifact and approve with 2FA on npm to publish.\n' >> "$GITHUB_STEP_SUMMARY"
