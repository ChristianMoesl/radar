schemaVersion: "2"
kind: sandbox
name: radar
displayName: Radar development sandbox
description: Go, Node.js via fnm, pnpm, native build tools and a private Docker daemon.
sourceURL: https://github.com/ChristianMoesl/radar

sandbox:
  # CI replaces this with the published multi-platform image digest before
  # publishing the kit. A pinned kit therefore also pins its toolchain image.
  image: docker.io/christianmoesl/radar-sandbox:latest
  entrypoint: [bash]

setup:
  startup:
    # Keep a failed runtime accessible; optional readiness gates dependent work.
    - command: [sh, -c, "sandbox-startup run || true"]
      user: "1000"
      background: false
      description: Run configured host-mounted startup scripts

# No host credentials, extra mounts, port exposure or network-policy overrides.
# The shell-docker base requests the private daemon inside SBX's microVM.
